<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoCare Pro | Mechanics</title>
<link rel="icon" href="../repairCar/media/logo.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="a-body" data-page="mechanics">

<!-- Sidebar is filled in by js/admin.js so every page shares the same menu -->
<aside class="a-sidebar" id="aSidebar"></aside>

<main class="a-main">
  <button class="a-sidebar-toggle" aria-label="Open menu"><i class="bi bi-list"></i></button>

  <header class="a-topbar">
    <div>
      <h1>Mechanics</h1>
      <p>Your workshop team, their workload and availability</p>
    </div>
    <div class="a-topbar-actions">
      <div class="a-search-wrap">
        <i class="bi bi-search"></i>
        <input class="a-search" placeholder="Search mechanics...">
      </div>
      <button class="a-btn a-btn-primary" id="addBtn"><i class="bi bi-plus-lg"></i> Add Mechanic</button>
      <div class="a-user-chip"></div>
    </div>
  </header>

  <section class="a-stats" id="stats"></section>
  <div class="a-cards" id="cards"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
<script src="js/mechanics.js"></script>
</body>
</html>
